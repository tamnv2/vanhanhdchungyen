name: One-time LAN V4 updater health repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lan-v4-updater-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Windows updater health loop and self-remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('lan-agent/Vhdchy.LanAgent/PilotV4.cs')
          s = p.read_text(encoding='utf-8')
          old = '''set "HEALTH_OK=0"\nfor /L %%i in (1,1,5) do (\n  powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:17891/health' -TimeoutSec 2; exit [int]($r.StatusCode -ne 200)" >nul 2>&1\n  if not errorlevel 1 set "HEALTH_OK=1"\n  if "%HEALTH_OK%"=="1" goto success\n  timeout /t 2 /nobreak >nul\n)'''
          new = '''for /L %%i in (1,1,5) do (\n  powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:17891/health' -TimeoutSec 2; exit [int]($r.StatusCode -ne 200)" >nul 2>&1\n  if not errorlevel 1 goto success\n  timeout /t 2 /nobreak >nul\n)'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one updater health loop, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          Path('.github/workflows/fix-lan-v4-updater-health.yml').unlink()
      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lan-agent/Vhdchy.LanAgent/PilotV4.cs .github/workflows/fix-lan-v4-updater-health.yml
          git commit -m 'fix(agent): make staged updater health success reachable'
          git push origin HEAD:main
