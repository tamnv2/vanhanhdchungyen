name: One-time LAN V4 source repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lan-v4-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair interpolated raw string in Agent updater
        shell: python
        run: |
          from pathlib import Path
          p = Path('lan-agent/Vhdchy.LanAgent/PilotV4.cs')
          s = p.read_text(encoding='utf-8')
          old = '''  powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "try {{$r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:17891/health' -TimeoutSec 2; if($r.StatusCode -eq 200){{exit 0}}}} catch {{}}; exit 1" >nul 2>&1'''
          new = '''  powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $r=Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:17891/health' -TimeoutSec 2; exit [int]($r.StatusCode -ne 200)" >nul 2>&1'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one updater health command, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lan-agent/Vhdchy.LanAgent/PilotV4.cs
          git commit -m 'fix(agent): repair V4 updater health-check script'
          git push origin HEAD:main
