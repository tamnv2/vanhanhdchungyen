name: One-time LAN V4 Android source repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lan-v4-android-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Android telemetry type and self-remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('android-pilot/app/src/main/java/vn/vhdchy/lanpilot/MainActivityV4.java')
          s = p.read_text(encoding='utf-8')
          old = 'int pssKb=Debug.getPss();'
          new = 'long pssKb=Debug.getPss();'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one Debug.getPss int assignment, found {n}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          Path('.github/workflows/fix-lan-v4-android-source.yml').unlink()
      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-pilot/app/src/main/java/vn/vhdchy/lanpilot/MainActivityV4.java .github/workflows/fix-lan-v4-android-source.yml
          git commit -m 'fix(android): correct V4 telemetry PSS type'
          git push origin HEAD:main
