name: Build LAN Pilot BETA

on:
  push:
    branches: [main]
    paths:
      - 'lan-agent/**'
      - 'android-pilot/**'
      - 'docs/lan/**'
      - '.github/workflows/build-lan-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lan-pilot-beta-build
  cancel-in-progress: true

jobs:
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable user-mode LAN Agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "0.2.$env:GITHUB_RUN_NUMBER"
          dotnet publish lan-agent/Vhdchy.LanAgent/Vhdchy.LanAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -o out/agent
          dotnet publish lan-agent/Vhdchy.LanLoadGen/Vhdchy.LanLoadGen.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/loadgen
          New-Item -ItemType Directory -Force -Path out/package | Out-Null
          Copy-Item out/agent/* out/package/
          New-Item -ItemType Directory -Force -Path out/package/tools | Out-Null
          Copy-Item out/loadgen/* out/package/tools/
          @'
          VHDCHY LAN Agent BETA — FULL LAN TEST / PORTABLE / NO ADMIN

          1. Extract ZIP to a user-writable folder.
          2. Run VHDCHY.LanAgent.exe as normal user. Do NOT Run as administrator.
          3. Double-click tray icon to open LAN Test Center.
          4. Test Center includes realtime visibility, transfer counters and local-only synthetic load buttons.
          5. Use 10/25/50/100 synthetic clients only as Agent capacity evidence; it does not represent Wi-Fi/RF capacity.
          6. After testing, export Agent ZIP diagnostics and FULL diagnostics TXT from each PDA.
          7. Do not alter corporate firewall/router/DNS or bypass security policy.
          '@ | Set-Content -Encoding UTF8 out/package/README_FIRST.txt
          Compress-Archive -Path out/package/* -DestinationPath out/VHDCHY-LAN-Agent-BETA-win-x64.zip -Force
          (Get-FileHash out/VHDCHY-LAN-Agent-BETA-win-x64.zip -Algorithm SHA256).Hash.ToLower() + '  VHDCHY-LAN-Agent-BETA-win-x64.zip' | Set-Content -Encoding ascii out/VHDCHY-LAN-Agent-BETA-win-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lan-pilot
          path: |
            out/VHDCHY-LAN-Agent-BETA-win-x64.zip
            out/VHDCHY-LAN-Agent-BETA-win-x64.sha256
          if-no-files-found: error

  android-pda:
    runs-on: ubuntu-latest
    environment: beta
    env:
      ANDROID_SIGNING_ALIAS: ${{ vars.ANDROID_SIGNING_ALIAS }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
      ANDROID_SIGNING_STORE_FILE: /tmp/vhdchy-beta.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore BETA signer
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_SIGNING_KEY_B64" | base64 -d > "$ANDROID_SIGNING_STORE_FILE"
          test -s "$ANDROID_SIGNING_STORE_FILE"
      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-pilot :app:assembleRelease --no-daemon
          mkdir -p out
          cp android-pilot/app/build/outputs/apk/release/app-release.apk out/VHDCHY-LAN-Pilot-BETA.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/VHDCHY-LAN-Pilot-BETA.apk
          sha256sum out/VHDCHY-LAN-Pilot-BETA.apk > out/VHDCHY-LAN-Pilot-BETA.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-lan-pilot
          path: |
            out/VHDCHY-LAN-Pilot-BETA.apk
            out/VHDCHY-LAN-Pilot-BETA.apk.sha256
          if-no-files-found: error

  prerelease:
    needs: [windows-agent, android-pda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish immutable BETA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="lan-pilot-beta-v0.2.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            artifacts/windows-lan-pilot/VHDCHY-LAN-Agent-BETA-win-x64.zip \
            artifacts/windows-lan-pilot/VHDCHY-LAN-Agent-BETA-win-x64.sha256 \
            artifacts/android-lan-pilot/VHDCHY-LAN-Pilot-BETA.apk \
            artifacts/android-lan-pilot/VHDCHY-LAN-Pilot-BETA.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "VHDCHY LAN Pilot BETA v0.2.${GITHUB_RUN_NUMBER}" \
            --notes "Comprehensive BETA LAN measurement build. Adds hard LAN-priority reacquisition testing, PDA↔Agent transfer tests, realtime PDA↔laptop↔PDA measurement, heavy realtime burst, FULL PDA suite, dashboard-triggered 10/25/50/100 synthetic load, richer metrics and diagnostics. Physical ceiling is currently two MT90; synthetic load supplements but does not replace RF evidence. No admin/router/DNS/firewall changes required."
